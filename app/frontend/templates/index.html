<!-- app/frontend/templates/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de Ventanas</title>
    

    <!-- CSS principal -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/style_contenendor.css">
</head>
<body>

    <!-- ===================================================== -->
    <!-- (1) TÍTULO -->
    <!-- ===================================================== -->
    <header id="app-header">
        <h1>Visualizador de Ventanas</h1>
        <a 
            href="https://github.com/Tehedor/windows_event_analyzer/blob/main/DSL_consulta.md" 
            target="_blank" 
            class="header-doc-link"
            title="Ver documentación de consultas"
        >
            📚 Documentación
        </a>
    </header>

    <!-- ===================================================== -->
    <!-- CONTENEDOR PRINCIPAL (2 columnas) -->
    <!-- ===================================================== -->
    <main id="app-container">

        <!-- ================================================= -->
        <!-- COLUMNA IZQUIERDA -->
        <!-- ================================================= -->
        <section id="left-panel">

            <!-- --------------------------------------------- -->
            <!-- (2) ÁREA DE VISUALIZACIÓN -->
            <!-- --------------------------------------------- -->
            <div id="visualization-container">
                <div id="view-mode-switch">
                    <input type="checkbox" id="toggle-view-mode" />
                    <label for="toggle-view-mode" class="switch"></label>
                </div>

                <!-- Texto placeholder mientras no hay datos -->
                <div id="visualization-placeholder">
                    <p>Selecciona una consulta para visualizar las ventanas</p>
                </div>

                <!-- Aquí se renderizarán las ventanas -->
                <div id="visualization-content">
                    <!-- visualizer.js inyectará aquí los bloques -->
                </div>

            </div>

        </section>

        <!-- ================================================= -->
        <!-- COLUMNA DERECHA -->
        <!-- ================================================= -->
        <section id="right-panel">
    
            <div id="query-form-outer">
                <div id="query-form-container">
                    <div class="form-header">
                        <h2>Nueva consulta</h2>
                        <button id="toggle-form-btn" title="Comprimir/Expandir">▲</button>
                    </div>
                    <form id="query-form">
                        <div class="form-group">
                            <label for="src-input">Patrón src (observación)</label>
                            <input type="text" id="src-input" name="src" placeholder="Ej: 475,484,*" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="dst-input">Patrón dst (predicción)</label>
                            <input type="text" id="dst-input" name="dst" placeholder="Ej: 511" autocomplete="off">
                        </div>
                        <button type="submit" id="run-query-btn">Buscar</button>
                    </form>
                </div>
            </div>

            <div class="panel-tabs">
                <button class="tab-btn active" data-target="view-consultas">Consultas</button>
                <button class="tab-btn" data-target="view-diccionario">Diccionario</button>
            </div>

            <div id="view-consultas" class="tab-view active">
                <div id="queries-list-container">
                    <h2>Histórico de consultas</h2>
                    <ul id="queries-list"></ul>
                </div>
            </div>

            <div id="view-diccionario" class="tab-view">
                <div id="dictionary-container">
                    <div id="custom-dropdown" class="custom-dropdown">
                        <div class="dropdown-header" id="dropdown-header">
                            <div style="display: flex; align-items: center;">
                                <div id="component-color-box" class="color-box" style="background-color: #d1d5db;"></div>
                                <span id="dropdown-selected-text">Todos los componentes</span>
                            </div>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                        <ul class="dropdown-list" id="dropdown-list"></ul>
                    </div>
                </div>
                <div id="dictionary-list-container">
                    <ul id="dictionary-events-list"></ul>
                </div>
            </div>
        </section>

    </main>

    <!-- ===================================================== -->
    <!-- JS (se cargan al final) -->
    <!-- ===================================================== -->
    <script type="module" src="/static/js/main.js"></script>


</body>
</html>
